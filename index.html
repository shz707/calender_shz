<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light-green">
    <div class="calendar-app">
        <div class="app-toolbar">
            <select id="theme-selector">
                <option value="theme-light-green">Theme: Light Green</option>
                <option value="theme-purple">Theme: Purple</option>
                <option value="theme-light-blue">Theme: Light Blue</option>
                <option value="theme-light-yellow">Theme: Light Yellow</option>
                <option value="theme-light-red">Theme: Light Red</option>
            </select>
            <button id="export-data-btn">Export Data (.txt)</button>
        </div>

        <header class="calendar-header">
            <button id="prev-month">&lt;</button>
            <h1 id="month-year-display">Month Year</h1>
            <button id="next-month">&gt;</button>
        </header>

        <div class="calendar-grid-header">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div id="calendar-grid" class="calendar-grid">
            <!-- Calendar days will be injected here via JS -->
        </div>

        <div class="history-btn-container">
            <button id="view-history-btn">View Monthly History</button>
        </div>
    </div>

    <!-- Dialog for Comments using closedby="any" -->
    <dialog id="comment-dialog" closedby="any" aria-labelledby="dialog-title">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 id="dialog-title">Comments</h2>
                <button id="close-dialog" class="close-btn" aria-label="Close dialog">&times;</button>
            </div>
            
            <div id="comments-list" class="comments-list">
                <!-- Comments injected here -->
            </div>

            <form id="comment-form" class="comment-form">
                <input type="text" id="comment-name" placeholder="Your Name" required>
                <textarea id="comment-text" placeholder="Add a comment..." required></textarea>
                <select id="comment-color">
                    <option value="none">Default Color</option>
                    <option value="green">Green</option>
                    <option value="yellow">Yellow</option>
                    <option value="red">Red</option>
                </select>
                <button type="submit">Post</button>
            </form>
        </div>
    </dialog>

    <!-- Dialog for History using closedby="any" -->
    <dialog id="history-dialog" closedby="any" aria-labelledby="history-title">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 id="history-title">History</h2>
                <button id="close-history" class="close-btn" aria-label="Close dialog">&times;</button>
            </div>
            
            <div id="history-list" class="history-list">
                <!-- History logs injected here -->
            </div>
        </div>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
